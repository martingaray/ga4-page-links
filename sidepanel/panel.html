<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GA4 Page Links · CookingMetrics</title>
  <link rel="stylesheet" href="panel.css">
  <script src="../shared/core.js" defer></script>
  <script src="i18n.js" defer></script>
  <script src="panel.js" defer></script>
</head>
<body>
  <header>
    <div class="masthead">
      <img src="../assets/icons/icon48.png" width="34" height="34" alt="">
      <div class="identity"><span>CookingMetrics</span><strong>GA4 Page Links</strong></div>
      <div class="languages" role="group" aria-label="Español / English">
        <button id="es" aria-label="Español" aria-pressed="true">ES</button><button id="en" aria-label="English" aria-pressed="false">EN</button>
      </div>
      <button id="menu-toggle" class="menu-icon" aria-expanded="false" aria-controls="menu" data-aria="menu" aria-label="Menú">
        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 4h16M2 10h16M2 16h16"/></svg>
      </button>
    </div>
    <nav id="menu" hidden data-aria="menu">
      <button data-open="help" data-i18n="help">Ayuda</button>
      <a data-resource="cooking" target="_blank" rel="noopener noreferrer">CookingMetrics ↗</a>
      <a data-resource="author" target="_blank" rel="noopener noreferrer">Martín Garay ↗</a>
      <a data-resource="github" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
    </nav>
    <nav class="sections" data-aria="sections">
      <button id="settings-nav" data-open="settings" aria-current="page" data-i18n="links">Enlaces</button>
      <button id="accounts-nav" data-open="accounts" data-i18n="accounts">Cuentas</button>
      <button id="audit-nav" data-open="audit" data-i18n="audit">Auditoría</button>
    </nav>
  </header>
  <main>
    <section id="settings-view">
      <p class="eyebrow" data-i18n="settingsKicker"></p>
      <h1 tabindex="-1" data-i18n="settingsTitle"></h1>
      <p class="intro" data-i18n="settingsIntro"></p>
      <div class="context">
        <span data-i18n="activeProperty"></span>
        <strong id="property">—</strong>
      </div>
      <p class="status" id="status" role="status"></p>
      <form id="settings-form" hidden>
        <fieldset id="settings-fields" disabled>
          <label for="origin" data-i18n="domain"></label>
          <input id="origin" type="text" inputmode="url" placeholder="https://tienda.example" autocomplete="off" spellcheck="false" required aria-describedby="origin-hint">
          <p id="origin-hint" class="hint" data-i18n="originHint"></p>
          <div class="preview"><span class="eyebrow" data-i18n="example"></span><samp id="preview"></samp></div>
          <label class="check"><input id="row-hostname" type="checkbox"><span data-i18n="rowHost"></span></label>
          <p class="hint" data-i18n="rowHint"></p>
          <button class="primary" id="save" type="submit" disabled data-i18n="save"></button>
          <button class="quiet" id="reset" type="button" disabled data-i18n="reset"></button>
        </fieldset>
      </form>
      <button id="directory-shortcut" class="text-link" type="button" data-open="accounts" data-i18n="goAccounts"></button>
    </section>
    <section id="accounts-view" hidden>
      <p class="eyebrow" data-i18n="directoryKicker"></p>
      <h1 tabindex="-1" data-i18n="accountsTitle"></h1>
      <p class="intro" data-i18n="accountsIntro"></p>
      <div id="directory-list-view">
        <button id="new-account" class="primary" type="button" data-i18n="newAccount" disabled></button>
        <label for="search" data-i18n="search"></label>
        <input id="search" type="search" data-ph="searchHint" autocomplete="off" spellcheck="false">
        <p id="list-info" class="hint" role="status"></p>
        <ul id="account-list"></ul>
      </div>
      <form id="account-form" hidden>
        <h2 id="editor-title"></h2>
        <fieldset id="account-fields">
          <label for="account-id" data-i18n="propertyId"></label>
          <input id="account-id" type="text" inputmode="numeric" pattern="[1-9][0-9]*" placeholder="123456789" autocomplete="off" required aria-describedby="id-hint">
          <p id="id-hint" class="hint" data-i18n="idHint"></p>
          <label for="account-name" data-i18n="name"></label>
          <input id="account-name" maxlength="80" type="text" data-ph="nameHint" autocomplete="off">
          <label for="account-origin" data-i18n="domain"></label>
          <input id="account-origin" type="text" inputmode="url" placeholder="https://tienda.example" autocomplete="off" required spellcheck="false">
          <p class="hint" data-i18n="originHint"></p>
          <label class="check"><input id="account-hostname" type="checkbox"><span data-i18n="rowHost"></span></label>
          <p class="hint" data-i18n="rowHint"></p>
          <div class="actions">
            <button id="account-save" class="primary" type="submit" data-i18n="saveEntry"></button>
            <button id="account-cancel" class="secondary" type="button" data-i18n="cancel"></button>
          </div>
          <button id="account-remove" class="quiet" type="button" data-i18n="remove" hidden></button>
        </fieldset>
      </form>
      <p id="account-status" class="status" role="status"></p>
    </section>
    <section id="audit-view" hidden>
      <p class="eyebrow" data-i18n="auditKicker"></p>
      <h1 tabindex="-1" data-i18n="auditTitle"></h1>
      <p class="intro" data-i18n="auditIntro"></p>
      <a class="primary external" data-resource="checklist" target="_blank" rel="noopener noreferrer"><span data-i18n="auditCTA"></span> ↗</a>
      <h2 data-i18n="auditWhere"></h2>
      <div class="topics">
        <a data-resource="purchases" target="_blank" rel="noopener noreferrer"><b data-i18n="purchases"></b><span data-i18n="purchasesHint"></span></a>
        <a data-resource="campaigns" target="_blank" rel="noopener noreferrer"><b data-i18n="campaigns"></b><span data-i18n="campaignsHint"></span></a>
        <a data-resource="config" target="_blank" rel="noopener noreferrer"><b data-i18n="config"></b><span data-i18n="configHint"></span></a>
      </div>
      <p class="note" data-i18n="auditPrivacy"></p>
    </section>
    <section id="help-view" hidden>
      <button id="help-back" class="text-link" data-i18n="back"></button>
      <p class="eyebrow">GA4 PAGE LINKS</p><h1 tabindex="-1" data-i18n="help"></h1>
      <h2 data-i18n="links"></h2><p data-i18n="helpLinks"></p>
      <h2 data-i18n="accounts"></h2><p data-i18n="helpAccounts"></p>
      <h2 data-i18n="audit"></h2><p data-i18n="auditPrivacy"></p>
      <h2 data-i18n="privacyTitle"></h2><p data-i18n="privacy"></p>
      <a class="text-link" data-resource="github" target="_blank" rel="noopener noreferrer" data-i18n="githubHelp"></a>
    </section>
  </main>
  <footer><a data-resource="cooking" target="_blank" rel="noopener noreferrer">CookingMetrics</a><span aria-hidden="true">·</span><a data-resource="author" target="_blank" rel="noopener noreferrer">martingaray.com.ar</a><a class="license" data-resource="license" target="_blank" rel="noopener noreferrer">MIT</a></footer>
  <dialog id="remove-dialog" aria-labelledby="remove-title" aria-describedby="remove-detail">
    <h2 id="remove-title" data-i18n="confirmTitle"></h2>
    <p id="remove-detail"></p>
    <div class="actions"><button id="remove-cancel" class="secondary" data-i18n="cancel" autofocus></button><button id="remove-confirm" class="danger" data-i18n="remove"></button></div>
  </dialog>
</body>
</html>
